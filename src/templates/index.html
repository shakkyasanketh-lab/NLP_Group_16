<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="header">
        <h1>🛡️ PhishGuard AI</h1>
        <p>Intelligent Phishing Email Detection System</p>
        <p class="subtitle">Neural Nexus | CCS3356 NLP | Group 16</p>
    </div>

    <!-- Input Section -->
    <div class="card">
        <h2>📧 Paste Email Content</h2>
        <textarea id="emailInput"
                  placeholder="Paste the email text here and click Analyze..."
                  rows="8"></textarea>
        <div class="btn-row">
            <button onclick="analyzeEmail()" class="btn-analyze">
                🔍 ANALYZE EMAIL
            </button>
            <button onclick="clearAll()" class="btn-clear">
                🗑️ CLEAR
            </button>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Analyzing email...</p>
    </div>

    <!-- Results -->
    <div id="results" class="hidden">

        <!-- Verdict Banner -->
        <div id="verdictBanner" class="verdict-banner">
            <div class="verdict-icon" id="verdictIcon"></div>
            <div class="verdict-text">
                <h2 id="verdictText"></h2>
                <p id="verdictSub"></p>
            </div>
            <div class="risk-badge" id="riskBadge"></div>
        </div>

        <!-- Confidence Meters -->
        <div class="card">
            <h2>📊 Model Agreement</h2>
            <div class="model-row">
                <div class="model-label">SVM</div>
                <div class="meter-bar">
                    <div class="meter-fill" id="svmBar"></div>
                </div>
                <div class="model-score" id="svmScore"></div>
                <div class="model-verdict" id="svmVerdict"></div>
            </div>
            <div class="model-row">
                <div class="model-label">BiLSTM</div>
                <div class="meter-bar">
                    <div class="meter-fill" id="bilstmBar"></div>
                </div>
                <div class="model-score" id="bilstmScore"></div>
                <div class="model-verdict" id="bilstmVerdict"></div>
            </div>
            <div class="model-row combined">
                <div class="model-label">COMBINED</div>
                <div class="meter-bar">
                    <div class="meter-fill" id="combinedBar"></div>
                </div>
                <div class="model-score" id="combinedScore"></div>
                <div class="model-verdict" id="combinedVerdict"></div>
            </div>
        </div>

        <!-- Suspicious Words -->
        <div class="card" id="suspiciousCard">
            <h2>🔍 Suspicious Elements Detected</h2>
            <div id="suspiciousWords" class="words-container"></div>
        </div>

    </div>

    <!-- Sample Emails -->
    <div class="card">
        <h2>💡 Try Sample Emails</h2>
        <div class="sample-row">
            <button onclick="loadSample('phishing')" class="btn-sample phishing">
                ⚠️ Load Phishing Sample
            </button>
            <button onclick="loadSample('legit')" class="btn-sample legit">
                ✅ Load Legitimate Sample
            </button>
        </div>
    </div>

</div>

<script>
const PHISHING_SAMPLE = `Dear Customer,

We have detected suspicious activity on your account. Your account will be 
SUSPENDED within 24 hours unless you verify your information immediately.

Please click the link below to verify your account and avoid suspension:
http://secure-banking-verify.com/login

You must provide your account number, password, and credit card details.
This is URGENT. Failure to respond will result in permanent account closure.

Bank Security Team`;

const LEGIT_SAMPLE = `Hi John,

Just a reminder that our team meeting is scheduled for tomorrow at 3:00 PM 
in Conference Room B.

The agenda includes the Q3 project review and planning for next quarter. 
Please bring your progress reports.

Looking forward to seeing everyone there.

Best regards,
Sarah`;

function loadSample(type) {
    document.getElementById('emailInput').value =
        type === 'phishing' ? PHISHING_SAMPLE : LEGIT_SAMPLE;
}

async function analyzeEmail() {
    const email = document.getElementById('emailInput').value.trim();
    if (!email) {
        alert('Please paste an email first!');
        return;
    }

    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('results').classList.add('hidden');

    try {
        const response = await fetch('/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        });

        const data = await response.json();

        if (data.error) {
            alert('Error: ' + data.error);
            return;
        }

        displayResults(data);

    } catch (err) {
        alert('Connection error: ' + err.message);
    } finally {
        document.getElementById('loading').classList.add('hidden');
    }
}

function displayResults(data) {
    const isPhishing = data.verdict === 'PHISHING';

    // Verdict banner
    const banner = document.getElementById('verdictBanner');
    banner.className = 'verdict-banner ' + (isPhishing ? 'phishing' : 'safe');
    document.getElementById('verdictIcon').textContent = isPhishing ? '⚠️' : '✅';
    document.getElementById('verdictText').textContent = data.verdict;
    document.getElementById('verdictSub').textContent =
        `Confidence: ${data.confidence}%`;
    document.getElementById('riskBadge').textContent = data.risk_level;
    document.getElementById('riskBadge').style.background = data.risk_color;

    // Model meters
    setMeter('svm',      data.svm_confidence,    data.svm_verdict);
    setMeter('bilstm',   data.bilstm_confidence, data.bilstm_verdict);
    setMeter('combined', data.confidence,        data.verdict);

    // Suspicious words
    const wordsDiv = document.getElementById('suspiciousWords');
    if (data.suspicious_words && data.suspicious_words.length > 0) {
        wordsDiv.innerHTML = data.suspicious_words
            .map(w => `<span class="word-tag">${w}</span>`)
            .join('');
        document.getElementById('suspiciousCard').style.display = 'block';
    } else {
        document.getElementById('suspiciousCard').style.display = 'none';
    }

    document.getElementById('results').classList.remove('hidden');
    document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
}

function setMeter(id, score, verdict) {
    const fill    = document.getElementById(id + 'Bar');
    const scoreEl = document.getElementById(id + 'Score');
    const verdEl  = document.getElementById(id + 'Verdict');

    fill.style.width = score + '%';
    fill.style.background = score >= 50 ? '#dc3545' : '#28a745';
    scoreEl.textContent = score + '%';
    verdEl.textContent  = verdict;
    verdEl.className    = 'model-verdict ' +
        (verdict === 'PHISHING' ? 'phishing-text' : 'safe-text');
}

function clearAll() {
    document.getElementById('emailInput').value = '';
    document.getElementById('results').classList.add('hidden');
}
</script>

</body>
</html>
